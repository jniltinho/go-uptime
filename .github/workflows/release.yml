name: Release

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'

permissions:
  contents: write

jobs:
  release:
    name: Pacotes e GitHub Release
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - name: Test
        # sudo: um dos testes usa ping (ICMP), que exige privilégios de superusuário
        run: sudo env "PATH=$PATH" "GOROOT=$(go env GOROOT)" "GOCACHE=$(go env GOCACHE)" "GOMODCACHE=$(go env GOMODCACHE)" go test ./... -race

      - name: Build release packages
        run: make release-cross VERSION="${GITHUB_REF_NAME#v}"

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Notas a partir da release anterior: a maior tag abaixo desta, o que inclui as antigas vX.Y.Z-fork.N
          # (a v6.0.0 parte da v5.36.0-fork.27), para não listar todo o histórico.
          previous=$(git tag --list 'v[0-9]*' --sort=-v:refname | sed -n "/^${GITHUB_REF_NAME//./\\.}\$/{n;p;q}" || true)
          packages=(dist/go-uptime_*_linux_amd64.tar.gz dist/go-uptime_*_linux_arm64.tar.gz)
          # A release pode já existir quando as notas foram escritas à mão logo depois da tag: nesse caso só faltam
          # os pacotes, e criar de novo falharia deixando a release sem binário nenhum
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" "${packages[@]}" --clobber
          else
            args=(--title "$GITHUB_REF_NAME" --generate-notes --latest --verify-tag)
            if [ -n "$previous" ]; then
              args+=(--notes-start-tag "$previous")
            fi
            gh release create "$GITHUB_REF_NAME" "${args[@]}" "${packages[@]}"
          fi

      - name: Check that the release has the packages
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          assets=$(gh release view "$GITHUB_REF_NAME" --json assets --jq '[.assets[].name] | join(" ")')
          for arch in amd64 arm64; do
            case "$assets" in
              *"_linux_$arch.tar.gz"*) ;;
              *) echo "a release $GITHUB_REF_NAME ficou sem o pacote linux_$arch: $assets"; exit 1 ;;
            esac
          done
          echo "pacotes na release: $assets"
