# Part of go-uptime, derived from Gatus by TwiN (Apache-2.0); files that existed in Gatus were modified. See NOTICE.
# The minimum configuration with the administration enabled: a SQL storage, a login and admin.enabled. There is no
# "endpoints" section on purpose: everything is registered at http://127.0.0.1:8080/admin and lives in the database.
#
# It starts as it is:  docker compose up -d   then sign in with the user "admin" and the password "go-uptime".
# CHANGE THE PASSWORD before this is reachable by anyone else. It asks for the new password and prints its hash:
#   docker run --rm -it jniltinho/go-uptime:v7.0.0 password hash
# Check the file after every change:
#   docker run --rm -v "$PWD/config:/config:ro" jniltinho/go-uptime:v7.0.0 config validate

storage:
  type: sqlite
  path: /data/data.db

security:
  basic:
    username: admin
    password-bcrypt-base64: "JDJhJDEwJDY2YjI2R1dQYXQwZlNEdmdFc2RwTC5sU1loNG12MktoTUQ5dEo5WXFNZHduWlMvcnZGT3Bp"

admin:
  enabled: true

# Public status pages (/status/<slug>) are created at /admin/status-pages. This only turns the public routes on.
status-pages:
  enabled: true
  # How many endpoints a page shows (1 to 1000). Raising it publishes more endpoints on the pages that were truncated.
  # maximum-endpoints-per-page: 400
