# Part of go-uptime, derived from Gatus by TwiN (Apache-2.0); files that existed in Gatus were modified. See NOTICE.
services:
  go-uptime:
    container_name: go-uptime
    image: jniltinho/go-uptime:v7.0.0
    ports:
      - "127.0.0.1:8080:8080"   # only on this machine: the example password is public
    volumes:
      - ./config:/config
      - go-uptime-data:/data
    networks:
      - default

  mattermost:
    container_name: mattermost
    image: mattermost/mattermost-preview:5.26.0
    ports:
      - "8065:8065"
    networks:
      - default

networks:
  default:
    driver: bridge

volumes:
  go-uptime-data:
