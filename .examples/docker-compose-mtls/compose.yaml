# Part of go-uptime, derived from Gatus by TwiN (Apache-2.0); files that existed in Gatus were modified. See NOTICE.
services:
  nginx:
    image: nginx:stable
    volumes:
      - ./certs/server:/etc/nginx/certs
      - ./nginx:/etc/nginx/conf.d
    ports:
      - "8443:443"
    networks:
      - mtls

  go-uptime:
    image: jniltinho/go-uptime:v7.0.0
    restart: always
    ports:
      - "127.0.0.1:8080:8080"   # only on this machine: the example password is public
    volumes:
      - ./config:/config
      - go-uptime-data:/data
      - ./certs/client:/certs
    environment:
      - GO_UPTIME_CONFIG_PATH=/config
    networks:
      - mtls

networks:
  mtls:

volumes:
  go-uptime-data:
