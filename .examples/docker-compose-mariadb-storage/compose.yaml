# Part of go-uptime, derived from Gatus by TwiN (Apache-2.0); files that existed in Gatus were modified. See NOTICE.
# Go Uptime with the MySQL/MariaDB storage of the jniltinho/go-uptime fork (see docs/storage-mysql.md).
# The image of the original Gatus (twinproduction/gatus) does not include this storage.
services:
  mariadb:
    image: mariadb:11.4.13
    command: ["--character-set-server=utf8mb4", "--collation-server=utf8mb4_bin"]
    volumes:
      - ./data/db:/var/lib/mysql
    environment:
      - MARIADB_DATABASE=go_uptime
      - MARIADB_USER=username
      - MARIADB_PASSWORD=password
      - MARIADB_ROOT_PASSWORD=root-password
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - web

  go-uptime:
    image: jniltinho/go-uptime:v7.0.0
    restart: always
    ports:
      - "8080:8080"
    environment:
      - MARIADB_USER=username
      - MARIADB_PASSWORD=password
      - MARIADB_DATABASE=go_uptime
    volumes:
      - ./config:/config
    networks:
      - web
    depends_on:
      mariadb:
        condition: service_healthy

networks:
  web:
